# The example commands (SPEC T5): a new config starts with them, and Settings →
# Commands → "Add example commands…" adds those you don't have.
  [[ui.commands]]
    name = "claude-compact"
    command = "/compact"
    group = "Claude"
    where = "remote"

  [[ui.commands]]
    name = "claude-continue"
    command = "claude --continue"
    group = "Claude"
    where = "remote"

  [[ui.commands]]
    name = "claude-exit"
    command = "/exit"
    group = "Claude"
    where = "remote"

  [[ui.commands]]
    name = "git-push"
    command = "git push"
    group = "Git"
    where = "local"

  [[ui.commands]]
    name = "git-status-tags"
    command = "git status; git tag"
    group = "Git"
    where = "local"

  [[ui.commands]]
    name = "git-tags-show"
    command = "git tag"
    group = "Git"
    where = "local"

  [[ui.commands]]
    name = "continue"
    command = "you can continue"
    group = "Text"
    where = "remote"

  [[ui.commands]]
    name = "do a cross check"
    command = "yes do a crosscheck now."
    group = "Text"
    where = "remote"

  [[ui.commands]]
    name = "i pushed"
    command = "i pushed"
    group = "Text"
    where = "remote"

  [[ui.commands]]
    name = "status?"
    command = "status?"
    group = "Text"
    where = "remote"

  [[ui.commands]]
    name = "what is next?"
    command = "What is next?"
    group = "Text"
    where = "remote"
