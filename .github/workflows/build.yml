# Test and build Session Workbench for Linux, Windows and macOS.
# Every push and pull request produces downloadable artifacts; pushing a
# tag v* also publishes them as a GitHub release.
#
# Actions are pinned to commit hashes (version in the comment). To update,
# take the new release tag's commit: git ls-remote https://github.com/<action> refs/tags/<tag>
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.16.0
  # Release binaries are built with the newest patch of this Go series
  # (security fixes); go.mod's go line is only the minimum.
  GO_VERSION: '1.26.x'
  # .deb / .rpm packaging: official nfpm release binary, checksum-verified.
  NFPM_VERSION: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04            # webkit2gtk-4.1; runs on Ubuntu 24.04 and newer
            platform: linux/amd64
            tags: webkit2_41
            # hardened like distribution binaries: PIE, full RELRO
            goflags: -buildmode=pie
            ldflags: -extldflags=-Wl,-z,relro,-z,now
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal  # Apple silicon and Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                # git describe needs tags

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22             # builds the frontend; Vite 6 also works on 18 (Ubuntu 24.04)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Product version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        # wails.json's productVersion goes into the Windows exe properties and
        # the macOS Info.plist; keep it in step with the release tag.
        run: |
          node -e '
            const fs = require("fs");
            const w = JSON.parse(fs.readFileSync("wails.json", "utf8"));
            w.info.productVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            fs.writeFileSync("wails.json", JSON.stringify(w, null, 2) + "\n");
          '
          grep productVersion wails.json

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build                 # frontend/dist must exist before Go compiles (embed)
          npm test

      - name: Go tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            go test -race -tags "${{ matrix.tags }}" ./...
          else
            go test ./...
          fi

      - name: Build
        env:
          GOFLAGS: ${{ matrix.goflags }}
        run: >
          wails build -s -clean
          -platform ${{ matrix.platform }}
          ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }}
          -ldflags "-X main.version=${{ steps.version.outputs.version }} ${{ matrix.ldflags }}"

      - name: Package
        run: |
          base="session-workbench-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          mkdir dist
          case "$RUNNER_OS" in
            Linux)   tar czf "dist/$base.tar.gz" -C build/bin session-workbench ;;
            Windows) (cd build/bin && 7z a -tzip "../../dist/$base.zip" session-workbench.exe >/dev/null) ;;
            macOS)   ditto -c -k --keepParent build/bin/session-workbench.app "dist/$base.zip" ;;
          esac

      - name: Linux packages (.deb, .rpm)
        if: runner.os == 'Linux'
        run: |
          tgz="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$tgz"
          echo "${NFPM_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" nfpm
          nfpm="$RUNNER_TEMP/nfpm"
          # v0.7.0 -> 0.7.0; v0.7.0-3-gabc123 (after a tag) -> 0.7.0+3.gabc123,
          # which sorts after 0.7.0 (a "-" would make it a pre-release).
          VERSION=$(git describe --tags --always | sed -E 's/^v//; s/-([0-9]+)-g([0-9a-f]+)$/+\1.g\2/')
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0+g$VERSION" ;; esac
          export VERSION
          packaging/gen-docs.sh "$VERSION"
          "$nfpm" package -f packaging/nfpm.yaml -p deb -t dist/
          "$nfpm" package -f build/pkgdocs/nfpm-rpm.yaml -p rpm -t dist/
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-workbench-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only regular files are release assets.
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          printf 'asset: %s\n' "${assets[@]}"
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
